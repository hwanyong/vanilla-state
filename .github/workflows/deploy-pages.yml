name: Deploy

# 랜딩 페이지를 https://lab.hwanyong.com/vanilla-state/ 로 배포한다.
#
# ★ 한때 GitHub Pages 로도 나갔다(blog.hwanyong.com/vanilla-state/). 2026-08-25 에 그 잡을
#   지웠다. 그 도메인은 이제 Cloudflare 가 서빙하고, 옛 경로는 Worker 가 lab 으로
#   301 한다. Pages 로 올려 봐야 아무도 읽지 않는 산출물이었다.
#   저장소 설정의 Pages 도 같은 날 껐다.
#
# ★ 되돌릴 곳이 없다. 이 잡이 실패하면 사이트는 ★직전 배포에 머문다★.
#   내려가지는 않지만 새 내용이 나가지 않는다. 실패를 방치하면 조용히 낡는다.
#
# ★ 잡이 하나다. 2026-09-10 까지는 build 잡이 dist/website 를 아티팩트로 올리고
#   cloudflare 잡이 내려받았다. 그 아티팩트는 retention-days 가 없어 90일씩 남았고,
#   같은 구조의 hwanyong.github.io 에서 112개 · 1.58 GB 가 계정의 Actions storage
#   무료 한도(0.5 GB)를 다 썼다. 한 잡에서 빌드하고 그대로 배포하면 아티팩트가 0개다.
#   아티팩트를 다시 들이면 retention-days 를 반드시 적는다.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 저장소를 읽는 것뿐이다. Pages 잡을 지우면서 그 잡이 쓰던 쓰기 권한도 함께 걷었다.
# 쓰지 않는 쓰기 권한을 남겨 두면 워크플로를 뺏겼을 때 넘겨줄 것이 그만큼 늘어난다.
permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Build website
        run: |
          mkdir -p dist/website
          cp -r example/* dist/website/
          cp dist/vanilla-state.min.js dist/website/

      - name: Arrange assets under the served path
        run: |
          mkdir -p out/vanilla-state
          cp -R dist/website/. out/vanilla-state/
          cp cloudflare/_headers out/_headers
          # ★ _redirects 도 함께 올린다. html_handling="none" 이라 디렉터리 색인이
          #   자동으로 잡히지 않고, 이 파일의 200 재작성이 그것을 잇는다.
          #   빠뜨리면 /<repo>/ 가 404 가 된다(실제로 그렇게 나갔다).
          cp cloudflare/_redirects out/_redirects

      # ── Cloudflare Workers (lab.hwanyong.com) ──────────────────────────
      # ★이 스텝이 유일한 배포다.★
      # ★ 선행 조건: 저장소 시크릿 CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
